<svg xmlns="http://www.w3.org/2000/svg" width="940" height="220" viewBox="0 0 940 220" role="img" aria-label="Two readings produce a time and a suggested grade">
  <title>Contrast flow</title>
  <desc>Two readings produce a time and a suggested grade</desc>
  <rect width="940" height="220" fill="#FBF8F2"/><text x="24" y="40" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="bold" fill="#211E1B" text-anchor="start">Contrast: two spots, one time and one grade</text><text x="24" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#6D635B" text-anchor="start">Measure the dim highlight and the bright shadow</text><rect x="24" y="94" width="270" height="102" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><circle cx="48" cy="120" r="16" fill="#E8730C"/><text x="48" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="72" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#211E1B" text-anchor="start">Highlights</text><text x="40" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Dim spot at easel.</text><text x="40" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Tap Measure.</text><line x1="310" y1="145" x2="334" y2="145" stroke="#E8730C" stroke-width="2.5"/><polygon points="334,145 324,140 324,150" fill="#E8730C"/><rect x="340" y="94" width="270" height="102" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><circle cx="364" cy="120" r="16" fill="#E8730C"/><text x="364" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="388" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#211E1B" text-anchor="start">Shadows</text><text x="356" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Bright spot at easel.</text><text x="356" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Tap Measure.</text><line x1="626" y1="145" x2="650" y2="145" stroke="#E8730C" stroke-width="2.5"/><polygon points="650,145 640,140 640,150" fill="#E8730C"/><rect x="656" y="94" width="270" height="102" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><circle cx="680" cy="120" r="16" fill="#E8730C"/><text x="680" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="704" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#211E1B" text-anchor="start">Answer</text><text x="672" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Time and suggested</text><text x="672" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">grade, side by side.</text><text x="24" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6D635B" text-anchor="start">Fine tune holds the trims and the burn. Reset puts every trim and the burn back to neutral.</text>
</svg>
