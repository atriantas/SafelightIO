<svg xmlns="http://www.w3.org/2000/svg" width="940" height="280" viewBox="0 0 940 280" role="img" aria-label="The dongle is the meter and the phone is the screen">
  <title>Dongle and phone</title>
  <desc>The dongle is the meter and the phone is the screen</desc>
  <rect width="940" height="280" fill="#FBF8F2"/><text x="24" y="40" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="bold" fill="#211E1B" text-anchor="start">The dongle is the meter; the phone is its screen</text><text x="24" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#6D635B" text-anchor="start">There is no display, keypad or battery in the dongle.</text><rect x="28" y="96" width="250" height="130" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><text x="48" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#211E1B" text-anchor="start">RP2350 dongle</text><text x="48" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">sensor, USB-C,</text><text x="48" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">paper catalogue,</text><text x="48" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">calibration and records</text><text x="48" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E8730C" text-anchor="start">no screen · no button</text><line x1="286" y1="160" x2="355" y2="160" stroke="#E8730C" stroke-width="2.5"/><polygon points="355,160 345,155 345,165" fill="#E8730C"/><rect x="365" y="96" width="210" height="130" rx="12" fill="#171110" stroke="#3A2620" stroke-width="1.5"/><text x="385" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#F4E8D6" text-anchor="start">USB-C + OTG</text><text x="385" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#C9A79A" text-anchor="start">The phone is the host.</text><text x="385" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#C9A79A" text-anchor="start">Allow the USB</text><text x="385" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#C9A79A" text-anchor="start">permission once.</text><line x1="585" y1="160" x2="654" y2="160" stroke="#E8730C" stroke-width="2.5"/><polygon points="654,160 644,155 644,165" fill="#E8730C"/><rect x="664" y="96" width="248" height="130" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><text x="684" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#211E1B" text-anchor="start">SafelightIO app</text><text x="684" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Exposure · Contrast</text><text x="684" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Split · Proof · Setup</text><text x="684" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">The five tools</text><text x="684" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E8730C" text-anchor="start">phone screen + touch</text><text x="24" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6D635B" text-anchor="start">Unplug the dongle and the app says No meter. Your settings and the paper list stay on the dongle.</text>
</svg>
