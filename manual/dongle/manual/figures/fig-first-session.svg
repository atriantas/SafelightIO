<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="252" viewBox="0 0 1180 252" role="img" aria-label="Six steps: connect, allow USB, choose paper, calibrate sensor, calibrate paper, measure">
  <title>Your first session</title>
  <desc>Six steps: connect, allow USB, choose paper, calibrate sensor, calibrate paper, measure</desc>
  <text x="24" y="40" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="bold" fill="#211E1B" text-anchor="start">Your first session</text><text x="24" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#6D635B" text-anchor="start">Connect the dongle once, then make a print</text><rect x="24" y="92" width="168" height="132" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><circle cx="48" cy="118" r="16" fill="#E8730C"/><text x="48" y="123" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="72" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#211E1B" text-anchor="start">Connect</text><text x="40" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">Plug the dongle into</text><text x="40" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">the phone with USB-C.</text><text x="40" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E8730C" text-anchor="start">each session</text><line x1="194" y1="158" x2="207" y2="158" stroke="#E8730C" stroke-width="2.5"/><polygon points="207,158 197,153 197,163" fill="#E8730C"/><rect x="209" y="92" width="168" height="132" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><circle cx="233" cy="118" r="16" fill="#E8730C"/><text x="233" y="123" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="257" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#211E1B" text-anchor="start">Allow USB</text><text x="225" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">Accept the Android</text><text x="225" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">USB permission.</text><text x="225" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E8730C" text-anchor="start">each session</text><line x1="379" y1="158" x2="392" y2="158" stroke="#E8730C" stroke-width="2.5"/><polygon points="392,158 382,153 382,163" fill="#E8730C"/><rect x="394" y="92" width="168" height="132" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><circle cx="418" cy="118" r="16" fill="#E8730C"/><text x="418" y="123" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="442" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#211E1B" text-anchor="start">Choose paper</text><text x="410" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">Filter brand first,</text><text x="410" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">then the paper.</text><text x="410" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E8730C" text-anchor="start">each session</text><line x1="564" y1="158" x2="577" y2="158" stroke="#E8730C" stroke-width="2.5"/><polygon points="577,158 567,153 567,163" fill="#E8730C"/><rect x="579" y="92" width="168" height="132" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><circle cx="603" cy="118" r="16" fill="#E8730C"/><text x="603" y="123" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="627" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#211E1B" text-anchor="start">Calibrate sensor</text><text x="595" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">Dark, then enlarger</text><text x="595" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">light. One-time.</text><text x="595" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E8730C" text-anchor="start">one-time</text><line x1="749" y1="158" x2="762" y2="158" stroke="#E8730C" stroke-width="2.5"/><polygon points="762,158 752,153 752,163" fill="#E8730C"/><rect x="764" y="92" width="168" height="132" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><circle cx="788" cy="118" r="16" fill="#E8730C"/><text x="788" y="123" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><text x="812" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#211E1B" text-anchor="start">Calibrate paper</text><text x="780" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">One test strip sets</text><text x="780" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">the constant.</text><text x="780" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E8730C" text-anchor="start">one-time</text><line x1="934" y1="158" x2="947" y2="158" stroke="#E8730C" stroke-width="2.5"/><polygon points="947,158 937,153 937,163" fill="#E8730C"/><rect x="949" y="92" width="168" height="132" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><circle cx="973" cy="118" r="16" fill="#E8730C"/><text x="973" y="123" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text><text x="997" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#211E1B" text-anchor="start">Measure &amp; print</text><text x="965" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">Zone V, Measure,</text><text x="965" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">use the time.</text><text x="965" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E8730C" text-anchor="start">each session</text><text x="24" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Steps 1–5 are setup. After that, day-to-day work is only step 6.</text>
</svg>
