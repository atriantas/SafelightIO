<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300" role="img" aria-label="A five-patch test strip and the two numbers to enter">
  <title>Paper calibration</title>
  <desc>A five-patch test strip and the two numbers to enter</desc>
  <rect width="940" height="300" fill="#FBF8F2"/><text x="24" y="40" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="bold" fill="#211E1B" text-anchor="start">Paper calibration in one test strip</text><text x="24" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#6D635B" text-anchor="start">Find the patch that matches the reference midtone</text><rect x="50" y="104" width="96" height="88" fill="#F4F1EA" stroke="#B9AD9F"/><text x="98" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6D635B" text-anchor="middle">too light</text><rect x="160" y="104" width="96" height="88" fill="#D8D2C7" stroke="#B9AD9F"/><text x="208" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6D635B" text-anchor="middle">light</text><rect x="270" y="104" width="96" height="88" fill="#8D8880" stroke="#B9AD9F"/><text x="318" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#211E1B" text-anchor="middle">correct</text><rect x="380" y="104" width="96" height="88" fill="#4C4945" stroke="#B9AD9F"/><text x="428" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6D635B" text-anchor="middle">dark</text><rect x="490" y="104" width="96" height="88" fill="#1D1C1B" stroke="#B9AD9F"/><text x="538" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6D635B" text-anchor="middle">too dark</text><rect x="270" y="98" width="112" height="100" fill="none" stroke="#E8730C" stroke-width="4"/><text x="326" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E8730C" text-anchor="middle">choose this</text><rect x="620" y="96" width="290" height="170" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><text x="640" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#211E1B" text-anchor="start">Enter two numbers</text><text x="640" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Known lux: the light on</text><text x="640" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">the strip during the test.</text><text x="640" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Known time: the exposure</text><text x="640" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">that produced the midtone.</text><text x="640" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E8730C" text-anchor="start">The dongle does the division.</text><text x="24" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6D635B" text-anchor="start">Calibrate the sensor first: dark, then enlarger light. The paper calibration is one-time per paper and filter.</text>
</svg>
