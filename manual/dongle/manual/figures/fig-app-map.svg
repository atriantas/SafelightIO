<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" role="img" aria-label="Top bar, selection bar, content and bottom navigation">
  <title>The app shell</title>
  <desc>Top bar, selection bar, content and bottom navigation</desc>
  <rect width="940" height="360" fill="#FBF8F2"/><text x="24" y="40" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="bold" fill="#211E1B" text-anchor="start">One screen, four places to look</text><text x="24" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#6D635B" text-anchor="start">The same shell on every tool</text><rect x="28" y="96" width="250" height="210" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><text x="48" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#211E1B" text-anchor="start">Top bar</text><text x="48" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">SafelightIO wordmark</text><text x="48" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Meter state: No meter,</text><text x="48" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Linking, Ready fw …</text><text x="48" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E8730C" text-anchor="start">Tap the state for Setup &gt; Meter</text><rect x="298" y="96" width="250" height="210" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><text x="318" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#211E1B" text-anchor="start">Selection bar</text><text x="318" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Paper name</text><text x="318" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Filter brand</text><text x="318" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Opens Paper &amp; filter</text><text x="318" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E8730C" text-anchor="start">No grade here</text><rect x="568" y="96" width="164" height="210" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><text x="588" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#211E1B" text-anchor="start">Content</text><text x="588" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">The tool</text><text x="588" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">and its answer</text><rect x="748" y="96" width="164" height="210" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><text x="768" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#211E1B" text-anchor="start">Bottom nav</text><text x="768" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Exposure</text><text x="768" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Contrast</text><text x="768" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Split</text><text x="768" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Proof</text><text x="768" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Setup</text><text x="24" y="342" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6D635B" text-anchor="start">Setup is the index: Device, Calibration and Work. The five tool tabs stay at the bottom.</text>
</svg>
