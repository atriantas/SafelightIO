<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" role="img" aria-label="Filter brand rail above collapsible paper brands">
  <title>Paper and filter sheet</title>
  <desc>Filter brand rail above collapsible paper brands</desc>
  <rect width="940" height="330" fill="#FBF8F2"/><text x="24" y="40" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="bold" fill="#211E1B" text-anchor="start">Paper &amp; filter: brand first, then paper</text><text x="24" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#6D635B" text-anchor="start">The sheet no longer asks for a filter grade</text><rect x="28" y="94" width="500" height="198" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><text x="48" y="120" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="bold" fill="#211E1B" text-anchor="start">Paper &amp; filter</text><rect x="48" y="136" width="456" height="44" rx="12" fill="#240000"/><text x="70" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FF0000" text-anchor="start">Ilford</text><rect x="196" y="136" width="82" height="44" rx="12" fill="#FF0000"/><text x="237" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Ilford</text><text x="292" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#FF0000" text-anchor="start">Foma</text><text x="370" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#FF0000" text-anchor="start">Kodak</text><text x="48" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FF0000" text-anchor="start">Paper</text><rect x="48" y="214" width="456" height="32" rx="8" fill="#FFFFFF" stroke="#D9CEBF"/><text x="64" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#211E1B" text-anchor="start">Ilford</text><text x="446" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#6D635B" text-anchor="start">3 papers</text><rect x="48" y="250" width="456" height="32" rx="8" fill="#FFFFFF" stroke="#D9CEBF"/><text x="64" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#211E1B" text-anchor="start">Foma</text><text x="446" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#6D635B" text-anchor="start">1 paper</text><rect x="552" y="94" width="360" height="198" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><text x="572" y="120" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="bold" fill="#211E1B" text-anchor="start">Where the grade lives</text><text x="572" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Filter grade is set on Exposure,</text><text x="572" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">not in this sheet.</text><rect x="572" y="184" width="320" height="44" rx="12" fill="#FBF8F2" stroke="#D9CEBF"/><text x="590" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#211E1B" text-anchor="start">Filter Grade Transform</text><text x="572" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">The bar shows the paper and the</text><text x="572" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">brand, never the grade.</text><text x="24" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6D635B" text-anchor="start">The dongle owns the catalogue. With no meter connected the sheet shows its empty state.</text>
</svg>
