<svg xmlns="http://www.w3.org/2000/svg" width="940" height="250" viewBox="0 0 940 250" role="img" aria-label="1200-baud touch, RPI-RP2 drive, copy UF2, wait">
  <title>Firmware update flow</title>
  <desc>1200-baud touch, RPI-RP2 drive, copy UF2, wait</desc>
  <rect width="940" height="250" fill="#FBF8F2"/><text x="24" y="40" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="bold" fill="#211E1B" text-anchor="start">Firmware update: no BOOTSEL button needed</text><text x="24" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#6D635B" text-anchor="start">The 1200-baud touch asks the running firmware to enter the ROM bootloader</text><rect x="24" y="94" width="210" height="104" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><circle cx="48" cy="120" r="16" fill="#E8730C"/><text x="48" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="72" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#211E1B" text-anchor="start">Open the port</text><text x="40" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">1200 baud from any</text><text x="40" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">serial terminal.</text><line x1="242" y1="146" x2="262" y2="146" stroke="#E8730C" stroke-width="2.5"/><polygon points="262,146 252,141 252,151" fill="#E8730C"/><rect x="256" y="94" width="210" height="104" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><circle cx="280" cy="120" r="16" fill="#E8730C"/><text x="280" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="304" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#211E1B" text-anchor="start">RPI-RP2 appears</text><text x="272" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">The dongle re-enumerates</text><text x="272" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">as a USB drive.</text><line x1="474" y1="146" x2="494" y2="146" stroke="#E8730C" stroke-width="2.5"/><polygon points="494,146 484,141 484,151" fill="#E8730C"/><rect x="488" y="94" width="210" height="104" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><circle cx="512" cy="120" r="16" fill="#E8730C"/><text x="512" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="536" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#211E1B" text-anchor="start">Copy the UF2</text><text x="504" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">Drop the new firmware</text><text x="504" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">onto the drive.</text><line x1="706" y1="146" x2="726" y2="146" stroke="#E8730C" stroke-width="2.5"/><polygon points="726,146 716,141 716,151" fill="#E8730C"/><rect x="720" y="94" width="210" height="104" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/><circle cx="744" cy="120" r="16" fill="#E8730C"/><text x="744" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="768" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#211E1B" text-anchor="start">Wait</text><text x="736" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">The drive disappears</text><text x="736" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">and the app reconnects.</text><line x1="938" y1="146" x2="958" y2="146" stroke="#E8730C" stroke-width="2.5"/><polygon points="958,146 948,141 948,151" fill="#E8730C"/><text x="24" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6D635B" text-anchor="start">No SDK, Picotool or button. A failed update can leave the app unbootable; keep the cable connected until the drive disappears.</text>
</svg>
