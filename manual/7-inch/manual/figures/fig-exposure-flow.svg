<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" role="img" aria-label="Exposure in four steps">
  <title>Exposure in four steps</title>
  <desc>Exposure in four steps</desc>
  <rect width="940" height="330" fill="#FBF8F2"/>
  <text x="24" y="40" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="bold" fill="#211E1B" text-anchor="start">Exposure, in four steps</text>
  <text x="24" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#6D635B" text-anchor="start">The meter turns one lux reading into a printing time</text>
  <rect x="24" y="92" width="204" height="186" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/>
  <circle cx="50" cy="120" r="17" fill="#E8730C"/>
  <text x="50" y="125.4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="76" y="127" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#211E1B" text-anchor="start">Choose paper</text>
  <text x="42" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#6D635B" text-anchor="start">Your paper and filter</text>
  <text x="42" y="181" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#6D635B" text-anchor="start">in the sidebar</text>
  <rect x="42" y="218" width="168" height="40" rx="6" fill="#FBF8F2" stroke="#D9CEBF" stroke-width="1.5"/>
  <text x="54" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#211E1B" text-anchor="start">Paper + filter</text>
  <line x1="232" y1="187" x2="254" y2="187" stroke="#E8730C" stroke-width="2.5"/>
  <polygon points="254,187 244,182 244,192" fill="#E8730C"/>
  <rect x="258" y="92" width="204" height="186" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/>
  <circle cx="284" cy="120" r="17" fill="#E8730C"/>
  <text x="284" y="125.4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="310" y="127" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#211E1B" text-anchor="start">Choose zone</text>
  <text x="276" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#6D635B" text-anchor="start">Usually V for the</text>
  <text x="276" y="181" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#6D635B" text-anchor="start">middle gray</text>
  <rect x="276" y="218" width="168" height="40" rx="6" fill="#FBF8F2" stroke="#D9CEBF" stroke-width="1.5"/>
  <text x="288" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#211E1B" text-anchor="start">Zone V</text>
  <line x1="466" y1="187" x2="488" y2="187" stroke="#E8730C" stroke-width="2.5"/>
  <polygon points="488,187 478,182 478,192" fill="#E8730C"/>
  <rect x="492" y="92" width="204" height="186" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/>
  <circle cx="518" cy="120" r="17" fill="#E8730C"/>
  <text x="518" y="125.4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="544" y="127" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#211E1B" text-anchor="start">Measure</text>
  <text x="510" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#6D635B" text-anchor="start">Put the sensor on the</text>
  <text x="510" y="181" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#6D635B" text-anchor="start">easel, press Measure LUX</text>
  <rect x="510" y="218" width="168" height="40" rx="6" fill="#FBF8F2" stroke="#D9CEBF" stroke-width="1.5"/>
  <text x="522" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#211E1B" text-anchor="start">Lux 2.84</text>
  <line x1="700" y1="187" x2="722" y2="187" stroke="#E8730C" stroke-width="2.5"/>
  <polygon points="722,187 712,182 712,192" fill="#E8730C"/>
  <rect x="726" y="92" width="204" height="186" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/>
  <circle cx="752" cy="120" r="17" fill="#E8730C"/>
  <text x="752" y="125.4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="778" y="127" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#211E1B" text-anchor="start">Read time</text>
  <text x="744" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#6D635B" text-anchor="start">Use the time, or adjust</text>
  <text x="744" y="181" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#6D635B" text-anchor="start">it with filter/dodge</text>
  <rect x="744" y="218" width="168" height="40" rx="6" fill="#FBF8F2" stroke="#D9CEBF" stroke-width="1.5"/>
  <text x="756" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#211E1B" text-anchor="start">8.8 s</text>
  <text x="24" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#6D635B" text-anchor="start">The filter grade and the dodge/burn slider change the time after step 4; you do not calculate anything yourself.</text>
</svg>
