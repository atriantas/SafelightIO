<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-label="Enlarger uniformity map and verdicts">
  <title>Enlarger uniformity map and verdicts</title>
  <desc>Enlarger uniformity map and verdicts</desc>
  <rect width="940" height="430" fill="#FBF8F2"/>
  <text x="24" y="40" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="bold" fill="#211E1B" text-anchor="start">Enlarger uniformity</text>
  <text x="24" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#6D635B" text-anchor="start">The same grid, with no negative, maps the bare light</text>
  <rect x="36" y="98" width="96" height="96" rx="6" fill="#BFD4E6" stroke="#B3261E" stroke-width="3"/>
  <text x="84.0" y="154.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#211E1B" text-anchor="middle">-18%</text>
  <rect x="132" y="98" width="96" height="96" rx="6" fill="#DCE7F2" stroke="#2A7F7F" stroke-width="1.5"/>
  <text x="180.0" y="154.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#211E1B" text-anchor="middle">-6%</text>
  <rect x="228" y="98" width="96" height="96" rx="6" fill="#F6E3C4" stroke="#2A7F7F" stroke-width="1.5"/>
  <text x="276.0" y="154.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#211E1B" text-anchor="middle">+3%</text>
  <rect x="36" y="194" width="96" height="96" rx="6" fill="#D2E0EC" stroke="#2A7F7F" stroke-width="1.5"/>
  <text x="84.0" y="250.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#211E1B" text-anchor="middle">-9%</text>
  <rect x="132" y="194" width="96" height="96" rx="6" fill="#FFFFFF" stroke="#2A7F7F" stroke-width="3"/>
  <text x="180.0" y="250.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#211E1B" text-anchor="middle">REF</text>
  <rect x="228" y="194" width="96" height="96" rx="6" fill="#F3D7A2" stroke="#2A7F7F" stroke-width="1.5"/>
  <text x="276.0" y="250.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#211E1B" text-anchor="middle">+6%</text>
  <rect x="36" y="290" width="96" height="96" rx="6" fill="#C6D9E8" stroke="#B3261E" stroke-width="3"/>
  <text x="84.0" y="346.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#211E1B" text-anchor="middle">-14%</text>
  <rect x="132" y="290" width="96" height="96" rx="6" fill="#E9EFF6" stroke="#2A7F7F" stroke-width="1.5"/>
  <text x="180.0" y="346.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#211E1B" text-anchor="middle">-2%</text>
  <rect x="228" y="290" width="96" height="96" rx="6" fill="#EFC98D" stroke="#2A7F7F" stroke-width="1.5"/>
  <text x="276.0" y="346.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#211E1B" text-anchor="middle">+11%</text>
  <text x="36" y="412" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">3 × 3 map: every cell is a reading</text>
  <rect x="372" y="98" width="190" height="10" rx="5" fill="#BFD4E6" stroke="none" stroke-width="1.5"/>
  <rect x="435" y="98" width="64" height="10" rx="5" fill="#F4F0E8" stroke="none" stroke-width="1.5"/>
  <rect x="499" y="98" width="63" height="10" rx="5" fill="#EFC98D" stroke="none" stroke-width="1.5"/>
  <text x="372" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6D635B" text-anchor="start">dimmer</text>
  <text x="435" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6D635B" text-anchor="middle">average</text>
  <text x="562" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6D635B" text-anchor="end">brighter</text>
  <text x="372" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#211E1B" text-anchor="start">Uniformity Limit</text>
  <text x="372" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">15% default · set in the sidebar</text>
  <rect x="372" y="224" width="260" height="150" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/>
  <text x="390" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#211E1B" text-anchor="start">Verdicts</text>
  <text x="390" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2A7F7F" text-anchor="start">GOOD</text>
  <text x="462" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6D635B" text-anchor="start">every point within half the limit</text>
  <text x="390" y="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#B37A14" text-anchor="start">MARGINAL</text>
  <text x="462" y="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6D635B" text-anchor="start">worst point within the limit</text>
  <text x="390" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#B3261E" text-anchor="start">UNEVEN</text>
  <text x="462" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6D635B" text-anchor="start">a point is beyond the limit</text>
  <text x="372" y="402" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">Select the centre cell, then press Set Reference. Each cell is the signed deviation from it.</text>
</svg>
