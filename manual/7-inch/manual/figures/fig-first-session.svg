<svg xmlns="http://www.w3.org/2000/svg" width="940" height="252" viewBox="0 0 940 252" role="img" aria-label="Your first session in five steps">
  <title>Your first session in five steps</title>
  <desc>Your first session in five steps</desc>
  <rect width="940" height="252" fill="#FBF8F2"/>
  <text x="24" y="40" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="bold" fill="#211E1B" text-anchor="start">Your first session</text>
  <text x="24" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#6D635B" text-anchor="start">One-time setup first, then a print</text>
  <rect x="24" y="92" width="168" height="132" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/>
  <circle cx="48" cy="118" r="16" fill="#E8730C"/>
  <text x="48" y="123.04" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="72" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#211E1B" text-anchor="start">Power on</text>
  <text x="40" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">Charge with USB-C,</text>
  <text x="40" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">press power.</text>
  <text x="40" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E8730C" text-anchor="start">2 min</text>
  <line x1="194" y1="158" x2="207" y2="158" stroke="#E8730C" stroke-width="2.5"/>
  <polygon points="207,158 197,153 197,163" fill="#E8730C"/>
  <rect x="209" y="92" width="168" height="132" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/>
  <circle cx="233" cy="118" r="16" fill="#E8730C"/>
  <text x="233" y="123.04" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="257" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#211E1B" text-anchor="start">Choose paper</text>
  <text x="225" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">Paper, type and</text>
  <text x="225" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">filter in sidebar.</text>
  <text x="225" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E8730C" text-anchor="start">Sidebar</text>
  <line x1="379" y1="158" x2="392" y2="158" stroke="#E8730C" stroke-width="2.5"/>
  <polygon points="392,158 382,153 382,163" fill="#E8730C"/>
  <rect x="394" y="92" width="168" height="132" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/>
  <circle cx="418" cy="118" r="16" fill="#E8730C"/>
  <text x="418" y="123.04" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="442" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#211E1B" text-anchor="start">Calibrate sensor</text>
  <text x="410" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">Dark, then the</text>
  <text x="410" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">enlarger light.</text>
  <text x="410" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E8730C" text-anchor="start">Control Panel</text>
  <line x1="564" y1="158" x2="577" y2="158" stroke="#E8730C" stroke-width="2.5"/>
  <polygon points="577,158 567,153 567,163" fill="#E8730C"/>
  <rect x="579" y="92" width="168" height="132" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/>
  <circle cx="603" cy="118" r="16" fill="#E8730C"/>
  <text x="603" y="123.04" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="627" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#211E1B" text-anchor="start">Calibrate paper</text>
  <text x="595" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">One test strip sets</text>
  <text x="595" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">the constant.</text>
  <text x="595" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E8730C" text-anchor="start">Chapter 10</text>
  <line x1="749" y1="158" x2="762" y2="158" stroke="#E8730C" stroke-width="2.5"/>
  <polygon points="762,158 752,153 752,163" fill="#E8730C"/>
  <rect x="764" y="92" width="168" height="132" rx="12" fill="#FFFFFF" stroke="#D9CEBF" stroke-width="1.5"/>
  <circle cx="788" cy="118" r="16" fill="#E8730C"/>
  <text x="788" y="123.04" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="812" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#211E1B" text-anchor="start">Measure &amp; print</text>
  <text x="780" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">Zone V, Measure</text>
  <text x="780" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6D635B" text-anchor="start">LUX, use the time.</text>
  <text x="780" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#E8730C" text-anchor="start">Exposure</text>
  <text x="24" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6D635B" text-anchor="start">Steps 3 and 4 are one-time jobs. You do them again only when the device, the paper or your enlarger changes.</text>
</svg>
